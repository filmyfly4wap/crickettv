<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Cricket TV</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .badge {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      padding: 6px 16px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 16px;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    h1 {
      font-size: 80px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 12px;
      color: #ef4444;
    }
    h2 {
      font-size: 24px;
      margin-bottom: 12px;
    }
    p {
      color: #94a3b8;
      max-width: 420px;
      margin-bottom: 28px;
      font-size: 16px;
    }
    a.btn {
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s;
    }
    a.btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="badge">Error Code 404</div>
  <h1>404</h1>
  <h2>Page Not Found</h2>
  <p>Aap jo link dhoondh rahe hain (jaise galat spelling) wo Cricket TV par maujood nahi hai.</p>
  <a href="/home" class="btn">Cricket TV Home Par Jayein</a>
</body>
</html>
